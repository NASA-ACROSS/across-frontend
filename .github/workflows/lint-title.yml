name: Lint Title
on:
    pull_request:
        branches: ['main']
        types: [opened, reopened, edited]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    pull-requests: write

jobs:
    do:
        runs-on: ubuntu-latest
        steps:
            - uses: NASA-ACROSS/github-action-commitlint@v1.0.1
