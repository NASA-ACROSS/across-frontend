name: Lint

# Lint should run on all files regardless of PR type e.g. Feature, Release, etc
on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: read
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint
        uses: ACROSS-Team/github-action-node-checks@v0.1.0
        with:
          check-type: lint
