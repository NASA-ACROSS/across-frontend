name: CI
on:
    pull_request:
        branches: ['main']
        types: [opened, synchronize, reopened]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    pull-requests: write

jobs:
    checks:
        uses: NASA-ACROSS/github-action-workflows/.github/workflows/workflow-ci-checks.yml@main
        with:
            runtime: node

    commitlint:
        runs-on: ubuntu-latest
        steps:
            - uses: NASA-ACROSS/github-action-commitlint@v1.0.1
